<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revo Card</title>
<style>
  :root{
    --ink:#0e1420;--panel:#141b28;--panel2:#1b2432;--line:#2a3548;
    --txt:#eef2f8;--mut:#8a97ab;--accent:#2fd4b8;--accent-d:#1a9d88;
    --gold:#c9a24b;--pink:#ff5d73;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--ink);color:var(--txt);min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:480px;margin:0 auto;padding:18px 16px 60px}

  /* ===== Fill mode ===== */
  .fhead{text-align:center;padding:14px 0 22px}
  .fhead .logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent-d));
    display:grid;place-items:center;margin:0 auto 12px;font-weight:800;color:#04231d;font-size:22px}
  .fhead h1{font-size:20px;font-weight:800}
  .fhead p{font-size:13px;color:var(--mut);margin-top:5px}

  .card-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .card-box h3{font-size:13px;color:var(--accent);margin-bottom:12px;font-weight:700}
  .field{margin-bottom:12px}
  .field:last-child{margin-bottom:0}
  .field label{font-size:12px;color:var(--mut);margin-bottom:6px;display:block;font-weight:600}
  .field input,.field textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;
    background:var(--panel2);color:var(--txt);font-family:inherit;font-size:14px;outline:none;transition:.15s}
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{resize:vertical;min-height:60px}
  .field .req{color:var(--pink);font-size:10px}

  .avatar-pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .av-opt{width:40px;height:40px;border-radius:11px;border:2px solid transparent;cursor:pointer;display:grid;place-items:center;
    font-weight:800;color:#04231d;font-size:15px}
  .av-opt.on{border-color:#fff}

  .byte-meter{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:14px;
    display:flex;align-items:center;gap:11px}
  .byte-meter .bm-bar{flex:1;height:8px;background:var(--panel2);border-radius:5px;overflow:hidden}
  .byte-meter .bm-bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:.2s}
  .byte-meter .bm-bar i.warn{background:var(--gold)}
  .byte-meter .bm-bar i.over{background:var(--pink)}
  .byte-meter .bm-txt{font-size:11.5px;color:var(--mut);white-space:nowrap;font-weight:700}

  .btn{width:100%;padding:15px;border:none;border-radius:13px;font-size:15px;font-weight:700;cursor:pointer;
    transition:.2s;font-family:inherit}
  .btn-main{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#04231d}
  .btn-main:active{transform:scale(.98)}
  .btn-main:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt);margin-top:10px}

  .result-box{background:linear-gradient(160deg,#173029,var(--panel));border:1px solid rgba(47,212,184,.3);
    border-radius:16px;padding:18px;margin-top:16px;display:none}
  .result-box.show{display:block}
  .result-box h3{color:var(--accent);font-size:15px;margin-bottom:10px}
  .result-box .link-row{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;
    font-size:11.5px;word-break:break-all;color:var(--mut);margin-bottom:10px;line-height:1.5}
  .steps{font-size:12.5px;color:var(--mut);line-height:2;margin-top:12px}
  .steps b{color:var(--txt)}

  /* ===== View mode (the actual digital card) ===== */
  .vcard{max-width:420px;margin:30px auto;padding:0 16px}
  .vhero{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;
    padding:30px 24px;text-align:center;position:relative;overflow:hidden}
  .vhero::before{content:"";position:absolute;top:-40%;right:-15%;width:60%;height:170%;
    background:radial-gradient(circle,rgba(47,212,184,.15),transparent 65%)}
  .v-av{width:92px;height:92px;border-radius:26px;margin:0 auto 16px;display:grid;place-items:center;font-size:38px;
    font-weight:800;color:#04231d;position:relative;box-shadow:0 10px 28px rgba(0,0,0,.35)}
  .vhero h1{font-size:24px;font-weight:800;position:relative}
  .vhero .vsub{font-size:14px;color:var(--mut);margin-top:4px;position:relative}
  .vhero .vbio{font-size:13px;color:var(--mut);margin-top:12px;line-height:1.7;position:relative}

  .save-btn{width:100%;padding:16px;margin-top:22px;border:none;border-radius:14px;font-size:15.5px;font-weight:800;
    background:linear-gradient(135deg,var(--gold),#e8c877);color:#2a1f04;cursor:pointer;position:relative;
    box-shadow:0 8px 22px rgba(201,162,75,.3)}
  .save-btn:active{transform:scale(.98)}

  .contact-list{margin-top:16px;display:flex;flex-direction:column;gap:9px}
  .c-row{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px;transition:.15s}
  .c-row:active{transform:scale(.98);border-color:var(--accent)}
  .c-row .ci{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
  .c-row .ct{flex:1;min-width:0}
  .c-row .ct b{font-size:13.5px;display:block}
  .c-row .ct span{font-size:11.5px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .social-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
  .s-tile{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:13px;font-size:13px;font-weight:600}
  .s-tile:active{transform:scale(.97)}

  .footer-note{text-align:center;font-size:11px;color:var(--mut);margin-top:28px;opacity:.6}
  .empty-view{max-width:420px;margin:80px auto;text-align:center;padding:0 20px;color:var(--mut)}
  .empty-view .ei{font-size:44px;margin-bottom:14px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);
    color:#04231d;padding:13px 22px;border-radius:13px;font-weight:700;font-size:13.5px;opacity:0;transition:.3s;
    z-index:200;box-shadow:0 8px 28px rgba(0,0,0,.35);max-width:88%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   REVO CARD — single static file, zero server, zero database.
   All data lives inside the URL hash, base64url-encoded JSON.
   ============================================================ */

const AVATAR_COLORS=[['#2fd4b8','#1a9d88'],['#4fa8ff','#2d6fb0'],['#ff5d73','#c7415a'],
  ['#c9a24b','#a5822f'],['#8b7dff','#5a4dd4'],['#3fc47c','#279d5c']];

/* ---- compact encode/decode (short keys to save bytes) ---- */
function encodeData(d){
  const json=JSON.stringify(d);
  const b64=btoa(unescape(encodeURIComponent(json)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return b64;
}
function decodeData(b64){
  try{
    let s=b64.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4)s+='=';
    const json=decodeURIComponent(escape(atob(s)));
    return JSON.parse(json);
  }catch(e){return null}
}
function currentUrl(data){
  const base=location.origin+location.pathname;
  return base+'#d='+encodeData(data);
}
function byteLen(str){return new TextEncoder().encode(str).length}

let toastT;
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2200)}

/* ---- router ---- */
function boot(){
  const hash=location.hash;
  if(hash.startsWith('#d=')){
    const data=decodeData(hash.slice(3));
    if(data) return renderView(data);
    return renderEmpty();
  }
  renderFill();
}
window.addEventListener('hashchange',boot);

/* ============================================================
   FILL MODE
   ============================================================ */
let state={n:'',t:'',c:'',p:'',w:'',e:'',web:'',ig:'',li:'',tw:'',tt:'',bio:'',av:0};

function renderFill(){
  const app=document.getElementById('app');
  app.innerHTML=`
  <div class="wrap">
    <div class="fhead">
      <div class="logo">R</div>
      <h1>أنشئ بطاقتك الرقمية</h1>
      <p>عبّي بياناتك، واحصل على رابط تكتبه على تاق NFC الخاص فيك</p>
    </div>

    <div class="card-box">
      <h3>المعلومات الأساسية</h3>
      <div class="field"><label>الاسم الكامل <span class="req">*إجباري</span></label>
        <input id="f_n" placeholder="محسن الراشد" oninput="upd('n',this.value)"></div>
      <div class="field"><label>المسمى الوظيفي</label>
        <input id="f_t" placeholder="مؤسس Revo" oninput="upd('t',this.value)"></div>
      <div class="field"><label>الشركة</label>
        <input id="f_c" placeholder="Revo" oninput="upd('c',this.value)"></div>
      <div class="field"><label>نبذة قصيرة</label>
        <textarea id="f_bio" placeholder="جملة واحدة عنك..." oninput="upd('bio',this.value)"></textarea></div>
      <div class="field"><label>لون البطاقة</label>
        <div class="avatar-pick" id="avPick"></div></div>
    </div>

    <div class="card-box">
      <h3>معلومات التواصل</h3>
      <div class="field"><label>رقم الهاتف</label>
        <input id="f_p" placeholder="+973 3300 0000" oninput="upd('p',this.value)"></div>
      <div class="field"><label>واتساب (إن كان مختلف)</label>
        <input id="f_w" placeholder="+973 3300 0000" oninput="upd('w',this.value)"></div>
      <div class="field"><label>البريد الإلكتروني</label>
        <input id="f_e" placeholder="name@email.com" oninput="upd('e',this.value)"></div>
      <div class="field"><label>الموقع الإلكتروني</label>
        <input id="f_web" placeholder="yoursite.com" oninput="upd('web',this.value)"></div>
    </div>

    <div class="card-box">
      <h3>حسابات التواصل الاجتماعي</h3>
      <div class="field"><label>إنستقرام</label>
        <input id="f_ig" placeholder="username" oninput="upd('ig',this.value)"></div>
      <div class="field"><label>لينكدإن</label>
        <input id="f_li" placeholder="username" oninput="upd('li',this.value)"></div>
      <div class="field"><label>X (تويتر)</label>
        <input id="f_tw" placeholder="username" oninput="upd('tw',this.value)"></div>
      <div class="field"><label>تيك توك</label>
        <input id="f_tt" placeholder="username" oninput="upd('tt',this.value)"></div>
    </div>

    <div class="byte-meter">
      <div class="bm-bar"><i id="bmBar" style="width:0%"></i></div>
      <div class="bm-txt" id="bmTxt">0 / 144 بايت</div>
    </div>

    <button class="btn btn-main" id="genBtn" onclick="generateLink()" disabled>🔗 أنشئ رابطي الآن</button>

    <div class="result-box" id="resultBox">
      <h3>✅ رابطك جاهز!</h3>
      <div class="link-row" id="linkOut"></div>
      <button class="btn btn-main" onclick="copyLink()">📋 نسخ الرابط</button>
      <button class="btn btn-ghost" onclick="previewCard()">👁 معاينة بطاقتي</button>
      <div class="steps">
        <b>الخطوة التالية:</b><br>
        ١. افتح تطبيق NFC Tools (أو NXP TagWriter)<br>
        ٢. اختر كتابة رابط (Website / URL)<br>
        ٣. الصق هذا الرابط بالكامل<br>
        ٤. اكتبه على تاق Revo الخاص بك<br>
        ٥. جرّب: قرّب أي هاتف من التاق — بطاقتك تظهر فوراً
      </div>
    </div>

    <div class="footer-note">Revo Card · لا سيرفر، لا قاعدة بيانات — بياناتك داخل رابطك فقط</div>
  </div>`;

  // avatar picker
  const pick=document.getElementById('avPick');
  AVATAR_COLORS.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='av-opt'+(i===state.av?' on':'');
    d.style.background='linear-gradient(135deg,'+c[0]+','+c[1]+')';
    d.textContent=(state.n||'ر')[0];
    d.onclick=()=>{state.av=i;renderFill();fillInputs()};
    pick.appendChild(d);
  });
  fillInputs();
  updateMeter();
}
function fillInputs(){
  document.getElementById('f_n').value=state.n;
  document.getElementById('f_t').value=state.t;
  document.getElementById('f_c').value=state.c;
  document.getElementById('f_bio').value=state.bio;
  document.getElementById('f_p').value=state.p;
  document.getElementById('f_w').value=state.w;
  document.getElementById('f_e').value=state.e;
  document.getElementById('f_web').value=state.web;
  document.getElementById('f_ig').value=state.ig;
  document.getElementById('f_li').value=state.li;
  document.getElementById('f_tw').value=state.tw;
  document.getElementById('f_tt').value=state.tt;
}
function upd(k,v){
  state[k]=v;
  if(k==='n'){document.querySelectorAll('.av-opt').forEach(el=>el.textContent=(v||'ر')[0])}
  updateMeter();
}
function packState(){
  // strip empty fields to save bytes
  const d={};
  const map={n:'n',t:'t',c:'c',p:'p',w:'w',e:'e',web:'web',ig:'ig',li:'li',tw:'tw',tt:'tt',bio:'bio',av:'av'};
  Object.keys(map).forEach(k=>{
    if(k==='av'){d.av=state.av;return}
    if(state[k]&&state[k].trim())d[k]=state[k].trim();
  });
  return d;
}
const TAG_BUDGET=144; // NTAG213 usable NDEF bytes (conservative)
function updateMeter(){
  const d=packState();
  const url=currentUrl(d);
  const bytes=byteLen(url);
  const pct=Math.min(100,(bytes/TAG_BUDGET)*100);
  const bar=document.getElementById('bmBar');
  const txt=document.getElementById('bmTxt');
  bar.style.width=pct+'%';
  bar.className=bytes>TAG_BUDGET?'over':(bytes>TAG_BUDGET*0.8?'warn':'');
  txt.textContent=bytes+' / '+TAG_BUDGET+' بايت (لتاق NTAG213)';
  const genBtn=document.getElementById('genBtn');
  genBtn.disabled=!state.n.trim();
}
function generateLink(){
  if(!state.n.trim()){toast('الاسم إجباري');return}
  const d=packState();
  const url=currentUrl(d);
  document.getElementById('linkOut').textContent=url;
  document.getElementById('resultBox').classList.add('show');
  document.getElementById('resultBox').scrollIntoView({behavior:'smooth',block:'start'});
  window._lastUrl=url;
}
function copyLink(){
  if(!window._lastUrl)return;
  navigator.clipboard.writeText(window._lastUrl).then(()=>toast('✅ تم نسخ الرابط'))
    .catch(()=>toast('انسخه يدويًا من المربع أعلاه'));
}
function previewCard(){
  if(!window._lastUrl)return;
  location.hash='#d='+encodeData(packState());
}

/* ============================================================
   VIEW MODE — the actual public digital card
   ============================================================ */
function renderView(d){
  const app=document.getElementById('app');
  const c=AVATAR_COLORS[d.av||0];
  const initial=(d.n||'?')[0];

  let contacts=[];
  if(d.p)contacts.push(['📞','الاتصال',d.p,'tel:'+d.p.replace(/\s/g,'')]);
  if(d.w)contacts.push(['💬','واتساب',d.w,'https://wa.me/'+d.w.replace(/[^0-9]/g,'')]);
  if(d.e)contacts.push(['✉️','البريد الإلكتروني',d.e,'mailto:'+d.e]);
  if(d.web)contacts.push(['🌐','الموقع',d.web,d.web.startsWith('http')?d.web:'https://'+d.web]);

  let socials=[];
  if(d.ig)socials.push(['📷','Instagram','https://instagram.com/'+d.ig.replace('@','')]);
  if(d.li)socials.push(['💼','LinkedIn','https://linkedin.com/in/'+d.li.replace('@','')]);
  if(d.tw)socials.push(['𝕏','X','https://x.com/'+d.tw.replace('@','')]);
  if(d.tt)socials.push(['🎵','TikTok','https://tiktok.com/@'+d.tt.replace('@','')]);

  app.innerHTML=`
  <div class="vcard">
    <div class="vhero">
      <div class="v-av" style="background:linear-gradient(135deg,${c[0]},${c[1]})">${initial}</div>
      <h1>${esc(d.n||'')}</h1>
      ${(d.t||d.c)?`<div class="vsub">${esc(d.t||'')}${d.t&&d.c?' · ':''}${esc(d.c||'')}</div>`:''}
      ${d.bio?`<div class="vbio">${esc(d.bio)}</div>`:''}
      <button class="save-btn" onclick="saveContact(${JSON.stringify(d).replace(/"/g,'&quot;')})">📥 حفظ جهة الاتصال</button>
    </div>

    ${contacts.length?`<div class="contact-list">
      ${contacts.map(([ic,label,val,href])=>`
        <a class="c-row" href="${href}">
          <div class="ci" style="background:rgba(47,212,184,.14)">${ic}</div>
          <div class="ct"><b>${label}</b><span>${esc(val)}</span></div>
        </a>`).join('')}
    </div>`:''}

    ${socials.length?`<div class="social-grid">
      ${socials.map(([ic,label,href])=>`
        <a class="s-tile" href="${href}" target="_blank"><span>${ic}</span><span>${label}</span></a>`).join('')}
    </div>`:''}

    <div class="footer-note">بطاقة رقمية · Revo Card</div>
  </div>`;
}
function renderEmpty(){
  document.getElementById('app').innerHTML=`
  <div class="empty-view">
    <div class="ei">🔗</div>
    <p>هذا الرابط غير صالح أو تالف.<br>تأكد من نسخه بالكامل بدون قص.</p>
  </div>`;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* vCard generation + download */
function saveContact(d){
  const lines=['BEGIN:VCARD','VERSION:3.0'];
  lines.push('FN:'+(d.n||''));
  if(d.c)lines.push('ORG:'+d.c);
  if(d.t)lines.push('TITLE:'+d.t);
  if(d.p)lines.push('TEL;TYPE=CELL:'+d.p);
  if(d.e)lines.push('EMAIL:'+d.e);
  if(d.web)lines.push('URL:'+(d.web.startsWith('http')?d.web:'https://'+d.web));
  lines.push('END:VCARD');
  const blob=new Blob([lines.join('\n')],{type:'text/vcard'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=(d.n||'contact').replace(/\s/g,'_')+'.vcf';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('📥 يتم حفظ جهة الاتصال...');
}

boot();
</script>
</body>
</html>
