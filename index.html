<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revo Card</title>
<style>
  :root{
    --ink:#0d1526;--panel:#141f33;--panel2:#1a2740;--line:#26344d;
    --txt:#eef2f8;--mut:#8b96a8;--accent:#c9a24b;--accent-d:#a5822f;--accent-ink:#2a1f04;
    --accent-rgb:201,162,75;--warn:#e8b93f;--pink:#ff5d73;--good:#2fd48a;
  }
  body.mode-s{
    --ink:#160b23;--panel:#241335;--panel2:#2e1846;--line:#432464;
    --txt:#faf0ff;--mut:#b79ecf;--accent:#ff4f9a;--accent-d:#c23f76;--accent-ink:#2b0619;
    --accent-rgb:255,79,154;
  }
  body.mode-k{
    --ink:#eaf6f7;--panel:#ffffff;--panel2:#f1fbfa;--line:#cfeee9;
    --txt:#123238;--mut:#5b7c81;--accent:#2bb3a3;--accent-d:#1f8f82;--accent-ink:#04231d;
    --accent-rgb:43,179,163;
  }
  body.mode-h{
    --ink:#fff5f5;--panel:#ffffff;--panel2:#fff0f0;--line:#f3c9c9;
    --txt:#3a1414;--mut:#8a5a5a;--accent:#e0342f;--accent-d:#b3221e;--accent-ink:#ffffff;
    --accent-rgb:224,52,47;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--ink);color:var(--txt);
    min-height:100vh;transition:background .25s,color .25s}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:480px;margin:0 auto;padding:18px 16px 60px}

  /* ===== Fill mode ===== */
  .fhead{text-align:center;padding:14px 0 22px}
  .fhead .logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent-d));
    display:grid;place-items:center;margin:0 auto 12px;font-weight:800;color:var(--accent-ink);font-size:22px}
  .fhead h1{font-size:20px;font-weight:800}
  .fhead p{font-size:13px;color:var(--mut);margin-top:5px}
  .back-link{display:inline-block;font-size:12.5px;color:var(--mut);margin-bottom:10px;cursor:pointer}
  .back-link:active{color:var(--accent)}

  .mode-grid{margin-top:4px}
  .mode-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;
    display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s}
  .mode-card:active{transform:scale(.98);border-color:var(--accent)}
  .mc-ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
  .mc-t{font-size:15px;font-weight:800;margin-bottom:3px}
  .mc-d{font-size:12px;color:var(--mut);line-height:1.5}

  .notice-box{background:#fff3cd;border:1px solid #ffe08a;color:#7a5b00;border-radius:13px;padding:12px 14px;
    font-size:12.5px;line-height:1.7;margin-bottom:14px}
  .warn-box{background:#3a2a10;border:1px solid #6b4d18;color:#f0c987;border-radius:12px;padding:12px 14px;
    font-size:12px;line-height:1.7;margin-bottom:12px}
  .edit-banner{background:var(--panel2);border:1px solid var(--accent);color:var(--accent-d);border-radius:12px;
    padding:10px 14px;font-size:12.5px;margin-bottom:14px;text-align:center;font-weight:700}
  .confirm-line{background:rgba(47,212,138,.1);border:1px solid var(--good);color:var(--txt);
    border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.6;text-align:center}

  .card-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .card-box h3{font-size:13px;color:var(--accent);margin-bottom:12px;font-weight:700}
  .field{margin-bottom:12px}
  .field:last-child{margin-bottom:0}
  .field label{font-size:12px;color:var(--mut);margin-bottom:6px;display:block;font-weight:600}
  .field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;
    background:var(--panel2);color:var(--txt);font-family:inherit;font-size:14px;outline:none;transition:.15s}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
  .field textarea{resize:vertical;min-height:60px}
  .field .req{color:var(--pink);font-size:10px}
  .field .hint{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.5}

  .btn{width:100%;padding:15px;border:none;border-radius:13px;font-size:15px;font-weight:700;cursor:pointer;
    transition:.2s;font-family:inherit}
  .btn-main{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:var(--accent-ink)}
  .btn-main:active{transform:scale(.98)}
  .btn-main:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt);margin-top:10px}
  .btn-row{display:flex;gap:8px}
  .btn-row .btn{flex:1;margin-top:0;display:flex;align-items:center;justify-content:center}

  .result-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px;display:none}
  .result-box.show{display:block}
  .result-box h3{color:var(--accent);font-size:15px;margin-bottom:14px}
  .result-box .link-row{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;
    font-size:11.5px;word-break:break-all;color:var(--mut);margin-bottom:10px;line-height:1.5}
  .result-section{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line)}
  .result-section:first-child{margin-top:0;padding-top:0;border-top:none}
  .result-section h4{font-size:13px;color:var(--accent);margin-bottom:8px;font-weight:800}
  .qr-wrap{background:#fff;border-radius:14px;padding:16px;display:flex;justify-content:center;margin-bottom:12px}
  .qr-wrap svg{width:180px;height:180px;display:block}

  .guide-list{margin-top:4px}
  .guide-step{display:flex;gap:12px;margin-bottom:16px}
  .guide-step:last-child{margin-bottom:0}
  .guide-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-d));
    color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
  .guide-body b{display:block;font-size:13.5px;margin-bottom:3px}
  .guide-body p{font-size:12.5px;color:var(--mut);line-height:1.7}
  .store-badges{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .store-badges a{flex:1;min-width:130px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:9px 12px;font-size:12px;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
  .store-badges a:active{border-color:var(--accent)}

  .help-link{display:block;text-align:center;font-size:12.5px;color:var(--mut);margin-top:16px;cursor:pointer}
  .help-link:active{color:var(--accent)}
  .manual-edit{display:flex;gap:8px}
  .manual-edit input{flex:1}
  .manual-edit button{width:auto;padding:0 16px;white-space:nowrap;margin-top:0}

  .not-found-box{max-width:420px;margin:60px auto;text-align:center;padding:0 20px}
  .not-found-box .ei{font-size:44px;margin-bottom:14px}
  .not-found-box h1{font-size:18px;margin-bottom:10px}
  .not-found-box p{color:var(--mut);font-size:13.5px;line-height:1.8;margin-bottom:18px}

  /* ===== View mode (the actual digital card) ===== */
  .vcard{max-width:420px;margin:30px auto;padding:0 16px}
  .vhero{background:var(--panel);border:1px solid var(--line);border-radius:22px;
    padding:30px 24px;text-align:center;position:relative;overflow:hidden}
  .vhero::before{content:"";position:absolute;top:-40%;right:-15%;width:60%;height:170%;
    background:radial-gradient(circle,rgba(var(--accent-rgb),.18),transparent 65%)}
  .v-av,.mc-ic{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:var(--accent-ink)}
  .v-av{width:92px;height:92px;border-radius:26px;margin:0 auto 16px;display:grid;place-items:center;font-size:38px;
    font-weight:800;position:relative;box-shadow:0 10px 28px rgba(0,0,0,.25);object-fit:cover}
  .v-img{object-fit:cover}
  .vhero h1{font-size:24px;font-weight:800;position:relative}
  .vhero .vsub{font-size:14px;color:var(--mut);margin-top:4px;position:relative}
  .vhero .vbio{font-size:13px;color:var(--mut);margin-top:12px;line-height:1.7;position:relative}
  .kid-tag{display:inline-block;background:var(--panel2);color:var(--accent-d);font-size:11px;font-weight:800;
    padding:4px 12px;border-radius:20px;margin-bottom:10px;position:relative}
  .med-cross{width:64px;height:64px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;font-size:30px;
    font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;
    box-shadow:0 10px 26px rgba(var(--accent-rgb),.3);position:relative}

  .save-btn,.cta-btn{width:100%;padding:16px;margin-top:22px;border:none;border-radius:14px;font-size:15.5px;font-weight:800;
    background:linear-gradient(135deg,var(--accent),var(--accent-d));color:var(--accent-ink);cursor:pointer;position:relative;
    box-shadow:0 8px 22px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;gap:9px}
  .save-btn:active,.cta-btn:active{transform:scale(.98)}
  .cta-ic{font-size:19px}

  .badge-row{display:flex;justify-content:center;gap:8px;margin-top:12px;position:relative;flex-wrap:wrap}
  .badge{background:var(--panel2);border:1px solid var(--line);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700}
  .med-note{margin-top:14px}

  .contact-list{margin-top:16px;display:flex;flex-direction:column;gap:9px}
  .c-row{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px;transition:.15s}
  .c-row:active{transform:scale(.98);border-color:var(--accent)}
  .c-row .ci{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex-shrink:0;
    background:var(--panel2);border:1px solid var(--line)}
  .c-row .ct{flex:1;min-width:0}
  .c-row .ct b{font-size:13.5px;display:block}
  .c-row .ct span{font-size:11.5px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .social-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
  .s-tile{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:13px;font-size:13px;font-weight:600}
  .s-tile:active{transform:scale(.97)}
  .s-tile-lg{flex-direction:column;text-align:center;padding:20px 12px;gap:8px;font-size:13.5px}
  .s-tile-lg .s-ic{font-size:27px}

  .med-info{margin-top:16px;display:flex;flex-direction:column;gap:10px}
  .med-block{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .med-block b{display:block;font-size:12.5px;color:var(--accent-d);margin-bottom:5px}
  .med-block p{font-size:13.5px;line-height:1.6}
  .med-block.med-alert{border-color:var(--accent)}

  .safety-note{margin-top:18px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px 16px;
    font-size:12.5px;color:var(--mut);line-height:1.8;text-align:center}

  .footer-note{text-align:center;font-size:11px;color:var(--mut);margin-top:28px;opacity:.7}
  .empty-view{max-width:420px;margin:80px auto;text-align:center;padding:0 20px;color:var(--mut)}
  .empty-view .ei{font-size:44px;margin-bottom:14px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);
    color:var(--accent-ink);padding:13px 22px;border-radius:13px;font-weight:700;font-size:13.5px;opacity:0;transition:.3s;
    z-index:200;box-shadow:0 8px 28px rgba(0,0,0,.35);max-width:88%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

function decodeData(b64){
  try{
    let s=b64.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4)s+='=';
    const json=decodeURIComponent(escape(atob(s)));
    return JSON.parse(json);
  }catch(e){return null}
}
function normalizeUrl(u){return /^https?:\/\//i.test(u)?u:'https://'+u}
function cleanHandle(v){
  if(!v)return '';
  let s=v.trim().replace(/^https?:\/\//i,'').replace(/^www\./i,'');
  const slash=s.indexOf('/');
  if(slash!==-1 && s.slice(0,slash).includes('.')) s=s.slice(slash+1);
  return s.replace(/^@/,'').replace(/\/+$/,'');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

   ============================================================ */
function randToken(len,alphabet){
  const arr=new Uint8Array(len);
  crypto.getRandomValues(arr);
  let out='';
  for(let i=0;i<len;i++) out+=alphabet[arr[i]%alphabet.length];
  return out;
}
const SHORTID_ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no O/0, I/1 (ambiguous when read aloud)
function genShortId(){return randToken(5,SHORTID_ALPHABET)}
function genEditToken(){
  const bytes=new Uint8Array(20); // 160 bits
  crypto.getRandomValues(bytes);
  let bin=''; bytes.forEach(x=>bin+=String.fromCharCode(x));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
const LS_CARD='revo_card_', LS_EDIT='revo_edit_';
const Backend={
  async create(data){
    let shortId;
    do{shortId=genShortId()}while(localStorage.getItem(LS_CARD+shortId));
    const editToken=genEditToken();
    localStorage.setItem(LS_CARD+shortId, JSON.stringify({editToken,data,updatedAt:Date.now()}));
    localStorage.setItem(LS_EDIT+editToken, shortId);
    return {shortId,editToken};
  },
  async update(editToken,data){
    const shortId=localStorage.getItem(LS_EDIT+editToken);
    if(!shortId) return null;
    const raw=localStorage.getItem(LS_CARD+shortId);
    if(!raw) return null;
    const rec=JSON.parse(raw);
    rec.data=data; rec.updatedAt=Date.now();
    localStorage.setItem(LS_CARD+shortId, JSON.stringify(rec));
    return {shortId};
  },
  async load(shortId){
    const raw=localStorage.getItem(LS_CARD+shortId);
    if(!raw) return null;
    try{return JSON.parse(raw).data}catch(e){return null}
  },
  async loadByEditToken(editToken){
    const shortId=localStorage.getItem(LS_EDIT+editToken);
    if(!shortId) return null;
    const data=await Backend.load(shortId);
    if(!data) return null;
    return {shortId,data};
  }
};

/* ============================================================
   QR code rendering (uses the inlined qrcode-generator library)
   ============================================================ */
function qrSvg(text,opts){
  opts=opts||{};
  const cell=opts.cell||8, margin=opts.margin!=null?opts.margin:cell*2;
  const dark=opts.dark||'#0d1220', light=opts.light||'#ffffff';
  const qr=qrcode(0,'M');
  qr.addData(text);
  qr.make();
  const n=qr.getModuleCount();
  const size=n*cell+margin*2;
  let path='';
  for(let r=0;r<n;r++){
    for(let c=0;c<n;c++){
      if(qr.isDark(r,c)){
        const x=margin+c*cell, y=margin+r*cell;
        path+=`M${x},${y}h${cell}v${cell}h-${cell}z `;
      }
    }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="QR">`+
    `<rect width="${size}" height="${size}" fill="${light}"/><path d="${path}" fill="${dark}"/></svg>`;
}
function downloadQrPng(svgString,filename){
  const img=new Image();
  const svgBlob=new Blob([svgString],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(svgBlob);
  img.onload=function(){
    const canvas=document.createElement('canvas');
    canvas.width=img.naturalWidth||512; canvas.height=img.naturalHeight||512;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);
    URL.revokeObjectURL(url);
    canvas.toBlob(function(blob){
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download=filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    },'image/png');
  };
  img.onerror=function(){toast('تعذر تحميل صورة QR')};
  img.src=url;
}

}
function backToPick(){state._step='pick';renderFill();}
function cancelEdit(){
  editState=null;
  Object.keys(state).forEach(k=>{state[k]=(k==='m'?null:(k==='_step'?'pick':''))});
  location.hash='';
  renderFill();
}
function loadStateFromData(data){
  Object.keys(state).forEach(k=>{if(k!=='_step')state[k]=(k==='m'?null:'')});
  state.m=data.m||'b';
  Object.keys(data).forEach(k=>{if(k!=='m')state[k]=data[k]});
}

function fieldsOf(mo){return mo.sections.flatMap(s=>s.fields)}
function requiredKeys(mo){return fieldsOf(mo).filter(f=>f.req).map(f=>f.k)}

function renderField(f){
  const id='f_'+f.k;
  const reqMark=f.req?'<span class="req">*إجباري</span>':'';
  let control;
  if(f.type==='textarea'){
    control=`<textarea id="${id}" placeholder="${f.ph||''}" oninput="upd('${f.k}',this.value)"></textarea>`;
  }else if(f.type==='select'){
    const opts=f.opts.map(o=>`<option value="${o}">${o}</option>`).join('');
    control=`<select id="${id}" onchange="upd('${f.k}',this.value)"><option value="">— اختر —</option>${opts}</select>`;
  }else{
    control=`<input id="${id}" type="${f.type||'text'}" placeholder="${f.ph||''}" oninput="upd('${f.k}',this.value)">`;
  }
  const hint=f.hint?`<div class="hint">${f.hint}</div>`:'';
  return `<div class="field"><label>${f.label} ${reqMark}</label>${control}${hint}</div>`;
}
function renderSection(sec){
  return `<div class="card-box"><h3>${sec.title}</h3>${sec.fields.map(renderField).join('')}</div>`;
}

function renderModeForm(){
  const mo=MODES[state.m];
  applyTheme(state.m);
  const app=document.getElementById('app');
  const isEditing=!!editState;
  app.innerHTML=`
  <div class="wrap">
    <div class="fhead">
      <a class="back-link" onclick="${isEditing?'cancelEdit()':'backToPick()'};return false;" href="#">← ${isEditing?'إلغاء التعديل':'تغيير نوع البطاقة'}</a>
      <div class="logo">${mo.icon}</div>
      <h1>${mo.title}</h1>
      <p>${mo.desc}</p>
    </div>
    ${isEditing?`<div class="edit-banner">✏️ أنت تعدّل بطاقة موجودة — التعديلات تُحفظ بنفس الرابط، والتاق لا يحتاج إعادة كتابة</div>`:''}
    ${mo.notice?`<div class="notice-box">${mo.notice}</div>`:''}
    ${mo.sections.map(renderSection).join('')}
    <div class="confirm-line">✅ لا حدود على حجم بياناتك — تُحفظ بأمان، والتاق يحمل رابطًا صغيرًا فقط</div>
    <button class="btn btn-main" id="genBtn" onclick="generateLink()" disabled>${isEditing?'💾 حفظ التعديلات':'✅ إنشاء بطاقتي'}</button>
    <div class="result-box" id="resultBox"></div>
    <div class="footer-note">Revo Card · بياناتك محفوظة بأمان، والتاق يحمل رابطًا صغيرًا فقط</div>
  </div>`;
  fillInputs(mo);
  updateValidation();
}
function fillInputs(mo){
  fieldsOf(mo).forEach(f=>{
    const el=document.getElementById('f_'+f.k);
    if(el) el.value=state[f.k]||'';
  });
}
function upd(k,v){state[k]=v;updateValidation()}

function packState(){
  if(!state.m) return {};
  const mo=MODES[state.m];
  const d={};
  if(state.m!=='b') d.m=state.m;
  fieldsOf(mo).forEach(f=>{
    let v=state[f.k];
    if(!v) return;
    if(HANDLE_FIELDS.includes(f.k)) v=cleanHandle(v);
    v=String(v).trim();
    if(v) d[f.k]=v;
  });
  return d;
}
function updateValidation(){
  const mo=MODES[state.m];
  if(!mo) return;
  const missing=requiredKeys(mo).some(k=>!String(state[k]||'').trim());
  const btn=document.getElementById('genBtn');
  if(btn) btn.disabled=missing;
}

async function generateLink(){
  const mo=MODES[state.m];
  const missing=requiredKeys(mo).find(k=>!String(state[k]||'').trim());
  if(missing){toast('يرجى تعبئة الحقول الإجبارية');return}
  const d=packState();
  const wasEditing=!!editState;
  const btn=document.getElementById('genBtn');
  const origText=btn.textContent;
  btn.disabled=true; btn.textContent='...جارٍ الحفظ';
  try{
    let shortId,editToken;
    if(wasEditing){
      const res=await Backend.update(editState.editToken,d);
      if(!res){toast('تعذر العثور على البطاقة للتعديل');return}
      shortId=res.shortId; editToken=editState.editToken;
    }else{
      const res=await Backend.create(d);
      shortId=res.shortId; editToken=res.editToken;
      editState={shortId,editToken};
      btn.textContent='💾 حفظ التعديلات';
      const fhead=document.querySelector('.fhead');
      if(fhead && !document.querySelector('.edit-banner')){
        const banner=document.createElement('div');
        banner.className='edit-banner';
        banner.textContent='✏️ أنت الآن تعدّل هذه البطاقة — أي حفظ جديد يُحدّث نفس الرابط';
        fhead.insertAdjacentElement('afterend',banner);
      }
    }
    const base=location.origin+location.pathname;
    showResult(base+'#c='+shortId, base+'#edit='+editToken);
    toast(wasEditing?'✅ تم حفظ التعديلات':'✅ تم إنشاء بطاقتك');
    return;
  } finally {
    btn.disabled=false;
    if(!wasEditing && btn.textContent==='...جارٍ الحفظ') btn.textContent=origText;
  }
}
function showResult(viewUrl,editUrl){
  window._lastViewUrl=viewUrl;
  window._lastEditUrl=editUrl;
  const svg=qrSvg(editUrl,{cell:8,margin:16});
  const box=document.getElementById('resultBox');
  box.innerHTML=`
    <h3>✅ بطاقتك جاهزة!</h3>
    <div class="result-section">
      <div class="warn-box">⚠️ احفظ رابط التعديل الآن — هذا مفتاحك الوحيد لتعديل بياناتك لاحقًا. لن نقدر نعرضه لك مرة ثانية بعد إغلاق الصفحة.</div>
      <div class="qr-wrap">${svg}</div>
      <div class="link-row">${esc(editUrl)}</div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="copyText(window._lastEditUrl,'✅ تم نسخ رابط التعديل')">📋 نسخ رابط التعديل</button>
        <button class="btn btn-ghost" onclick="downloadQrPng(qrSvg(window._lastEditUrl,{cell:8,margin:16}),'revo-edit-qr.png')">⬇️ تحميل QR</button>
      </div>
    </div>
    <div class="result-section">
      <h4>هذا فقط ما يُكتب على التاق 👇</h4>
      <div class="link-row">${esc(viewUrl)}</div>
      <div class="btn-row">
        <button class="btn btn-main" onclick="copyText(window._lastViewUrl,'✅ تم نسخ رابط العرض')">📋 نسخ رابط العرض</button>
        <a class="btn btn-ghost" href="${viewUrl}" target="_blank" rel="noopener">👁 معاينة</a>
      </div>
    </div>
    <div class="result-section">
      <h4>الخطوات التالية</h4>
      ${guideHTML(viewUrl)}
    </div>`;
  box.classList.add('show');
  box.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ============================================================
   VIEW MODE — the actual public digital card
   ============================================================ */
function buildAvatar(d,cls){
  const initial=esc((d.n||'?').trim().charAt(0)||'?');
  if(d.img){
    return `<img src="${esc(d.img)}" class="${cls} v-img" alt=""
      onerror="this.outerHTML='&lt;div class=&quot;${cls}&quot;&gt;${initial}&lt;/div&gt;'">`;
  }
  return `<div class="${cls}">${initial}</div>`;
}
function renderView(d){
  const m=d.m||'b';
  applyTheme(m);
  if(m==='s')return renderSocialView(d);
  if(m==='k')return renderKidsView(d);
  if(m==='h')return renderMedicalView(d);
  return renderBusinessView(d);
}
function renderBusinessView(d){
  const app=document.getElementById('app');
  let contacts=[];
  if(d.p)contacts.push(['📞','الاتصال',d.p,'tel:'+d.p.replace(/\s/g,'')]);
  if(d.w)contacts.push(['💬','واتساب',d.w,'https://wa.me/'+d.w.replace(/[^0-9]/g,'')]);
  if(d.e)contacts.push(['✉️','البريد الإلكتروني',d.e,'mailto:'+d.e]);
  if(d.web)contacts.push(['🌐','الموقع',d.web,normalizeUrl(d.web)]);
  const socials=['ig','li','tw','tt'].filter(k=>d[k]).map(k=>[SOCIAL_ICONS[k],SOCIAL_LABELS[k],SOCIAL_LINKS[k](d[k])]);

  app.innerHTML=`
  <div class="vcard">
    <div class="vhero">
      ${buildAvatar(d,'v-av')}
      <h1>${esc(d.n||'')}</h1>
      ${(d.t||d.c)?`<div class="vsub">${esc(d.t||'')}${d.t&&d.c?' · ':''}${esc(d.c||'')}</div>`:''}
      ${d.bio?`<div class="vbio">${esc(d.bio)}</div>`:''}
      <button class="save-btn" onclick="saveContact(${JSON.stringify(d).replace(/"/g,'&quot;')})">📥 حفظ جهة الاتصال</button>
    </div>
    ${contacts.length?`<div class="contact-list">${contacts.map(([ic,label,val,href])=>`
      <a class="c-row" href="${href}">
        <div class="ci">${ic}</div>
        <div class="ct"><b>${label}</b><span>${esc(val)}</span></div>
      </a>`).join('')}</div>`:''}
    ${socials.length?`<div class="social-grid">${socials.map(([ic,label,href])=>`
      <a class="s-tile" href="${href}" target="_blank" rel="noopener"><span>${ic}</span><span>${label}</span></a>`).join('')}</div>`:''}
    <div class="footer-note">بطاقة رقمية · Revo Card</div>
  </div>`;
}
function renderSocialView(d){
  const app=document.getElementById('app');
  const socials=['ig','tt','sc','yt','tw','tg'].filter(k=>d[k]).map(k=>[SOCIAL_ICONS[k],SOCIAL_LABELS[k],SOCIAL_LINKS[k](d[k])]);
  app.innerHTML=`
  <div class="vcard">
    <div class="vhero">
      ${buildAvatar(d,'v-av')}
      <h1>${esc(d.n||'')}</h1>
      ${d.bio?`<div class="vbio">${esc(d.bio)}</div>`:''}
    </div>
    ${socials.length?`<div class="social-grid">${socials.map(([ic,label,href])=>`
      <a class="s-tile s-tile-lg" href="${href}" target="_blank" rel="noopener"><span class="s-ic">${ic}</span><span>${label}</span></a>`).join('')}</div>`:''}
    <div class="footer-note">بطاقة رقمية · Revo Card</div>
  </div>`;
}
function renderKidsView(d){
  const app=document.getElementById('app');
  const guardianTel=d.gp?esc(d.gp.replace(/\s/g,'')):'';
  app.innerHTML=`
  <div class="vcard">
    <div class="vhero">
      ${buildAvatar(d,'v-av')}
      <div class="kid-tag">بطاقة أمان الطفل</div>
      <h1>${esc(d.n||'')}</h1>
      ${d.bg?`<div class="badge-row"><span class="badge">🩸 ${esc(d.bg)}</span></div>`:''}
      ${guardianTel?`<a class="cta-btn" href="tel:${guardianTel}"><span class="cta-ic">📞</span><span>اتصل بولي الأمر فورًا</span></a>`:''}
      ${d.med?`<div class="vbio med-note"><b>معلومة طبية: </b>${esc(d.med)}</div>`:''}
    </div>
    <div class="safety-note">🛡️ هذا الطفل يحمل سوار Revo — اضغط الزر أعلاه للاتصال بولي أمره فورًا.</div>
    <div class="footer-note">بطاقة رقمية · Revo Card</div>
  </div>`;
}
function renderMedicalView(d){
  const app=document.getElementById('app');
  const epTel=d.ep?esc(d.ep.replace(/\s/g,'')):'';
  app.innerHTML=`
  <div class="vcard">
    <div class="vhero">
      ${d.img?buildAvatar(d,'v-av'):'<div class="med-cross">✚</div>'}
      <h1>${esc(d.n||'')}</h1>
      ${d.bg?`<div class="badge-row"><span class="badge">🩸 ${esc(d.bg)}</span></div>`:''}
      ${epTel?`<a class="cta-btn" href="tel:${epTel}"><span class="cta-ic">📞</span><span>اتصال طارئ · ${esc(d.ep)}</span></a>`:''}
    </div>
    ${(d.all||d.cond||d.meds)?`<div class="med-info">
      ${d.all?`<div class="med-block med-alert"><b>⚠️ حساسية من أدوية</b><p>${esc(d.all)}</p></div>`:''}
      ${d.cond?`<div class="med-block"><b>الحالات الصحية المزمنة</b><p>${esc(d.cond)}</p></div>`:''}
      ${d.meds?`<div class="med-block"><b>الأدوية الحالية</b><p>${esc(d.meds)}</p></div>`:''}
    </div>`:''}
    <button class="save-btn" onclick="saveContact(${JSON.stringify(d).replace(/"/g,'&quot;')})">📥 حفظ جهة اتصال الطوارئ</button>
    <div class="footer-note">بطاقة رقمية · Revo Card</div>
  </div>`;
}
function renderEmpty(){
  document.getElementById('app').innerHTML=`
  <div class="empty-view">
    <div class="ei">🔗</div>
    <p>هذا الرابط غير صالح أو تالف.<br>تأكد من نسخه بالكامل بدون قص.</p>
  </div>`;
}

/* vCard generation + download */
function buildVCard(d){
  const m=d.m||'b';
  const lines=['BEGIN:VCARD','VERSION:3.0','FN:'+(d.n||'')];
  if(m==='h'){
    if(d.ep)lines.push('TEL;TYPE=CELL:'+d.ep);
    const note=[];
    if(d.bg)note.push('فصيلة الدم: '+d.bg);
    if(d.all)note.push('حساسية: '+d.all);
    if(d.cond)note.push('حالات مزمنة: '+d.cond);
    if(d.meds)note.push('أدوية: '+d.meds);
    if(note.length)lines.push('NOTE:'+note.join(' | '));
  }else{
    if(d.c)lines.push('ORG:'+d.c);
    if(d.t)lines.push('TITLE:'+d.t);
    if(d.p)lines.push('TEL;TYPE=CELL:'+d.p);
    if(d.e)lines.push('EMAIL:'+d.e);
    if(d.web)lines.push('URL:'+normalizeUrl(d.web));
  }
  lines.push('END:VCARD');
  return lines.join('\n');
}
function saveContact(d){
  const blob=new Blob([buildVCard(d)],{type:'text/vcard'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=(d.n||'contact').replace(/\s/g,'_')+'.vcf';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('📥 يتم حفظ جهة الاتصال...');
}

boot();
</script>
