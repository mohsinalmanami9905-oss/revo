<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revo Card</title>
<style>
  :root{
    --ink:#141b19;--panel:#1c2422;--panel2:#212a27;--line:#313c38;
    --txt:#f4f7f5;--mut:#8fa39c;--accent:#35d999;--accent-d:#1fae7c;--accent-ink:#062318;
    --accent-rgb:53,217,153;--warn:#e8b93f;--pink:#ff5d73;--good:#35d999;
  }
  /* view-mode-only accents (kept distinct for functional reasons: emergency visibility, tone) */
  body.mode-s{
    --ink:#160b23;--panel:#241335;--panel2:#2e1846;--line:#432464;
    --txt:#faf0ff;--mut:#b79ecf;--accent:#ff4f9a;--accent-d:#c23f76;--accent-ink:#2b0619;--accent-rgb:255,79,154;
  }
  body.mode-k{
    --ink:#eaf6f7;--panel:#ffffff;--panel2:#f1fbfa;--line:#cfeee9;
    --txt:#123238;--mut:#5b7c81;--accent:#2bb3a3;--accent-d:#1f8f82;--accent-ink:#04231d;--accent-rgb:43,179,163;
  }
  body.mode-h{
    --ink:#fff5f5;--panel:#ffffff;--panel2:#fff0f0;--line:#f3c9c9;
    --txt:#3a1414;--mut:#8a5a5a;--accent:#e0342f;--accent-d:#b3221e;--accent-ink:#ffffff;--accent-rgb:224,52,47;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',sans-serif;
    background:var(--ink);color:var(--txt);min-height:100vh;transition:background .25s,color .25s;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:420px;margin:0 auto;padding:16px 18px 60px}
  svg{display:block}
  .ic{display:inline-flex;flex-shrink:0}
  .en{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;direction:ltr;unicode-bidi:embed}

  /* ===== Hero / header ===== */
  .hero{position:relative;height:172px;border-radius:0 0 26px 26px;overflow:hidden;
    background:
      radial-gradient(circle at 15% 20%,rgba(255,255,255,.05),transparent 40%),
      radial-gradient(circle at 85% 75%,rgba(255,255,255,.04),transparent 45%),
      linear-gradient(135deg,#1a2422 0%,#141b19 55%,#0f1614 100%)}
  .hero::before{content:"";position:absolute;inset:0;opacity:.5;
    background-image:
      linear-gradient(35deg,transparent 46%,rgba(255,255,255,.035) 47%,transparent 48%),
      linear-gradient(-35deg,transparent 46%,rgba(255,255,255,.035) 47%,transparent 48%),
      linear-gradient(65deg,transparent 40%,rgba(0,0,0,.15) 41%,transparent 42%);
    background-size:64px 64px,64px 64px,110px 110px}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,27,25,0) 45%,var(--ink) 100%)}
  .hero-inner{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px}
  .lockup{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .lockup .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-d));
    display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-weight:800;font-size:16px}
  .lockup .word{font-size:23px;font-weight:800;letter-spacing:.3px;color:#fff}
  .tagline{font-size:10.5px;letter-spacing:4px;color:var(--accent);font-weight:700}
  .lang-toggle{position:absolute;top:14px;inset-inline-end:14px;z-index:2;display:flex;background:rgba(15,22,20,.5);
    backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:3px;gap:2px;cursor:pointer}
  .lang-toggle .seg{padding:5px 11px;border-radius:16px;font-size:10.5px;font-weight:700;color:var(--mut)}
  .lang-toggle .seg.on{background:var(--accent);color:var(--accent-ink)}

  /* ===== Fill mode ===== */
  .fhead{padding:18px 0 20px}
  .fhead-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .back-btn{width:32px;height:32px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--txt);cursor:pointer;flex-shrink:0}
  .progress-dots{display:flex;gap:5px}
  .progress-dots i{width:18px;height:4px;border-radius:2px;background:var(--line);display:block}
  .progress-dots i.on{background:var(--accent)}
  .fhead-eyebrow{font-size:11px;color:var(--mut);font-weight:700;margin-bottom:5px}
  .fhead h1{font-size:20px;font-weight:800;margin-bottom:5px}
  .fhead p{font-size:12.5px;color:var(--mut);line-height:1.7}
  .fhead-icon-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .fhead-icon-row .ic-tile{width:38px;height:38px;border-radius:11px;background:rgba(var(--accent-rgb),.14);
    color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}

  .mode-grid{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
  .mode-card{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);
    border-radius:15px;padding:13px 14px;cursor:pointer;transition:.15s}
  .mode-card:active{transform:scale(.98);border-color:var(--accent)}
  .mc-ic{width:42px;height:42px;flex-shrink:0;border-radius:12px;background:rgba(var(--accent-rgb),.12);
    color:var(--accent);display:flex;align-items:center;justify-content:center}
  .mc-t{font-size:14.5px;font-weight:700;margin-bottom:2px}
  .mc-d{font-size:11.5px;color:var(--mut)}
  .mc-chev{color:var(--mut);flex-shrink:0}

  .notice-box{display:flex;gap:10px;background:#fff3cd;border:1px solid #ffe08a;color:#7a5b00;border-radius:13px;padding:12px 14px;
    font-size:12px;line-height:1.7;margin-bottom:14px}
  .notice-box .ic{color:#c9971f;margin-top:1px}
  .warn-box{display:flex;gap:9px;background:#3a2a10;border:1px solid #6b4d18;color:#f0c987;border-radius:12px;padding:11px 13px;
    font-size:11.5px;line-height:1.7;margin-bottom:12px}
  .warn-box .ic{color:var(--warn);margin-top:1px;flex-shrink:0}
  .edit-banner{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--panel2);border:1px solid var(--accent);
    color:var(--accent);border-radius:12px;padding:10px 14px;font-size:12px;margin-bottom:14px;text-align:center;font-weight:700}
  .confirm-line{display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(var(--accent-rgb),.1);
    border:1px solid var(--good);color:var(--txt);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:12px}
  .confirm-line .ic{color:var(--accent);flex-shrink:0}

  .existing-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border:1px dashed var(--line);
    border-radius:13px;padding:12px 16px;margin-bottom:16px;cursor:pointer}
  .existing-row span{font-size:12px;color:var(--mut);font-weight:600}

  .card-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .card-box h3{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--accent);margin-bottom:12px;font-weight:800;letter-spacing:.2px}
  .field{margin-bottom:12px}
  .field:last-child{margin-bottom:0}
  .field label{font-size:11.5px;color:var(--mut);margin-bottom:6px;display:block;font-weight:600}
  .field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;
    background:var(--panel2);color:var(--txt);font-family:inherit;font-size:13.5px;outline:none;transition:.15s}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
  .field textarea{resize:vertical;min-height:58px}
  .field .req{color:var(--pink);font-size:10px}
  .field .hint{font-size:10.5px;color:var(--mut);margin-top:6px;line-height:1.5}
  .icon-field{display:flex;align-items:center;background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;overflow:hidden;transition:.15s}
  .icon-field:focus-within{border-color:var(--accent)}
  .icon-field .icon-pre{width:38px;height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    border-inline-end:1px solid var(--line)}
  .icon-field input{border:none;background:transparent;padding:11px 12px;flex:1;min-width:0}

  .photo-row{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:14px;margin-bottom:12px;cursor:pointer}
  .photo-av-wrap{position:relative;width:60px;height:60px;flex-shrink:0}
  .photo-av{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#2b3532,#20302b);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--mut);overflow:hidden}
  .photo-av img{width:100%;height:100%;object-fit:cover}
  .photo-badge{position:absolute;bottom:-2px;inset-inline-start:-2px;width:22px;height:22px;border-radius:50%;background:var(--accent);
    border:3px solid var(--panel);display:flex;align-items:center;justify-content:center;color:var(--accent-ink)}
  .photo-title{font-size:13px;font-weight:700;margin-bottom:2px}
  .photo-desc{font-size:10.5px;color:var(--mut);line-height:1.6}

  .btn{width:100%;padding:15px;border:none;border-radius:13px;font-size:14.5px;font-weight:700;cursor:pointer;
    transition:.2s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-main{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:var(--accent-ink)}
  .btn-main:active{transform:scale(.98)}
  .btn-main:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt);margin-top:10px}
  .btn-row{display:flex;gap:8px}
  .btn-row .btn{flex:1;margin-top:0}

  .result-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px;display:none}
  .result-box.show{display:block}
  .success-head{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:20px}
  .success-ic{width:50px;height:50px;border-radius:50%;background:rgba(var(--accent-rgb),.14);border:1.5px solid var(--accent);
    color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  .success-head h3{font-size:17px;font-weight:800;margin-bottom:3px}
  .success-head p{font-size:11.5px;color:var(--mut)}
  .result-box .link-row{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;
    font-size:11px;word-break:break-all;color:var(--mut);margin-bottom:10px;line-height:1.6}
  .result-section{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
  .result-section:first-child{margin-top:0;padding-top:0;border-top:none}
  .result-section h4{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt);margin-bottom:9px;font-weight:700}
  .result-section h4 .ic{color:var(--accent)}
  .qr-wrap{background:#fff;border-radius:14px;padding:14px;display:flex;justify-content:center;margin-bottom:11px}
  .qr-wrap svg{width:150px;height:150px}
  .steps{margin-top:4px}
  .step-row{display:flex;gap:11px;margin-bottom:14px}
  .step-row:last-child{margin-bottom:0}
  .step-num{width:27px;height:27px;border-radius:50%;background:var(--panel2);border:1.5px solid var(--accent);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;flex-shrink:0}
  .step-num.final{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:var(--accent-ink);border:none}
  .step-body b{display:block;font-size:12.5px;margin-bottom:2px}
  .step-body p{font-size:11px;color:var(--mut);line-height:1.6}
  .app-card{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;
    padding:12px;margin-bottom:10px}
  .app-tile{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent-d));
    color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .app-card b{font-size:13px;font-weight:800;display:block;margin-bottom:1px}
  .app-card span{font-size:10.5px;color:var(--mut)}
  .store-badges{display:flex;gap:8px;margin-bottom:14px}
  .store-badge{flex:1;display:flex;align-items:center;gap:8px;background:#0e1412;border:1px solid var(--line);border-radius:12px;
    padding:9px 11px;min-height:44px}
  .store-badge .bl{font-size:8px;color:var(--mut);line-height:1.3}
  .store-badge .bn{font-size:11.5px;font-weight:700;line-height:1.3;color:#fff}

  /* ===== View mode (the actual digital card) ===== */
  .vcard{max-width:420px;margin:30px auto;padding:0 16px}
  .vhero{background:var(--panel);border:1px solid var(--line);border-radius:22px;
    padding:30px 24px;text-align:center;position:relative;overflow:hidden}
  .vhero::before{content:"";position:absolute;top:-40%;right:-15%;width:60%;height:170%;
    background:radial-gradient(circle,rgba(var(--accent-rgb),.18),transparent 65%)}
  .v-av,.mc-ic{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:var(--accent-ink)}
  .v-av{width:92px;height:92px;border-radius:26px;margin:0 auto 16px;display:grid;place-items:center;font-size:36px;
    font-weight:800;position:relative;box-shadow:0 10px 28px rgba(0,0,0,.25);object-fit:cover}
  .v-img{object-fit:cover}
  .vhero h1{font-size:23px;font-weight:800;position:relative}
  .vhero .vsub{font-size:13.5px;color:var(--mut);margin-top:4px;position:relative}
  .vhero .vbio{font-size:12.5px;color:var(--mut);margin-top:12px;line-height:1.7;position:relative}
  .kid-tag{display:inline-block;background:var(--panel2);color:var(--accent-d);font-size:11px;font-weight:800;
    padding:4px 12px;border-radius:20px;margin-bottom:10px;position:relative}
  .med-cross{width:62px;height:62px;border-radius:18px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;
    box-shadow:0 10px 26px rgba(var(--accent-rgb),.3);position:relative}

  .save-btn,.cta-btn{width:100%;padding:16px;margin-top:22px;border:none;border-radius:14px;font-size:15px;font-weight:800;
    background:linear-gradient(135deg,var(--accent),var(--accent-d));color:var(--accent-ink);cursor:pointer;position:relative;
    box-shadow:0 8px 22px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;gap:9px}
  .save-btn:active,.cta-btn:active{transform:scale(.98)}

  .badge-row{display:flex;justify-content:center;gap:8px;margin-top:12px;position:relative;flex-wrap:wrap}
  .badge{display:flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);padding:6px 14px;
    border-radius:20px;font-size:12.5px;font-weight:700}
  .med-note{margin-top:14px}

  .contact-list{margin-top:16px;display:flex;flex-direction:column;gap:9px}
  .c-row{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;transition:.15s}
  .c-row:active{transform:scale(.98);border-color:var(--accent)}
  .c-row .ci{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    background:var(--panel2);border:1px solid var(--line);color:var(--accent)}
  .c-row .ct{flex:1;min-width:0}
  .c-row .ct b{font-size:13px;display:block}
  .c-row .ct span{font-size:11px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .social-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
  .s-tile{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:12px;font-size:12.5px;font-weight:600;color:var(--accent)}
  .s-tile span:last-child{color:var(--txt)}
  .s-tile:active{transform:scale(.97)}
  .s-tile-lg{flex-direction:column;text-align:center;padding:18px 12px;gap:7px;font-size:13px}

  .med-info{margin-top:16px;display:flex;flex-direction:column;gap:10px}
  .med-block{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .med-block b{display:block;font-size:12px;color:var(--accent-d);margin-bottom:5px}
  .med-block p{font-size:13px;line-height:1.6}
  .med-block.med-alert{border-color:var(--accent)}

  .safety-note{margin-top:18px;display:flex;gap:9px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px 15px;
    font-size:12px;color:var(--mut);line-height:1.8;text-align:start}
  .safety-note .ic{color:var(--accent);flex-shrink:0;margin-top:2px}

  .footer-note{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;margin-top:26px;opacity:.6}
  .footer-note .fmark{font-size:13px;font-weight:800;letter-spacing:.5px}
  .footer-note .fsub{font-size:10.5px;color:var(--mut)}
  .empty-view,.not-found-box{max-width:420px;margin:70px auto;text-align:center;padding:0 20px}
  .empty-view .ei,.not-found-box .ei{width:52px;height:52px;margin:0 auto 16px;color:var(--mut)}
  .not-found-box h1{font-size:18px;margin-bottom:10px;font-weight:800}
  .not-found-box p{color:var(--mut);font-size:13px;line-height:1.8;margin-bottom:18px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);
    color:var(--accent-ink);padding:13px 22px;border-radius:13px;font-weight:700;font-size:13px;opacity:0;transition:.3s;
    z-index:200;box-shadow:0 8px 28px rgba(0,0,0,.35);max-width:88%;text-align:center;display:flex;align-items:center;gap:8px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;

        if (b == -1) throw 'eof';
        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

              bytes.push(b & 0xff);

          }
        }
      }

/* ---- legacy self-contained encode/decode, kept forever for old tags ---- */
function decodeData(b64){
  try{
    let s=b64.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4)s+='=';
    const json=decodeURIComponent(escape(atob(s)));
    return JSON.parse(json);
  }catch(e){return null}
}
function normalizeUrl(u){return /^https?:\/\//i.test(u)?u:'https://'+u}
function cleanHandle(v){
  if(!v)return '';
  let s=v.trim().replace(/^https?:\/\//i,'').replace(/^www\./i,'');
  const slash=s.indexOf('/');
  if(slash!==-1 && s.slice(0,slash).includes('.')) s=s.slice(slash+1);
  return s.replace(/^@/,'').replace(/\/+$/,'');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ============================================================
   ID generation + storage ("Backend") — see header note above
   ============================================================ */
function randToken(len,alphabet){
  const arr=new Uint8Array(len);
  crypto.getRandomValues(arr);
  let out='';
  for(let i=0;i<len;i++) out+=alphabet[arr[i]%alphabet.length];
  return out;
}
const SHORTID_ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no O/0, I/1 (ambiguous when read aloud)
function genShortId(){return randToken(5,SHORTID_ALPHABET)}
function genEditToken(){
  const bytes=new Uint8Array(20); // 160 bits
  crypto.getRandomValues(bytes);
  let bin=''; bytes.forEach(x=>bin+=String.fromCharCode(x));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
const LS_CARD='revo_card_', LS_EDIT='revo_edit_';
const Backend={
  async create(data){
    let shortId;
    do{shortId=genShortId()}while(localStorage.getItem(LS_CARD+shortId));
    const editToken=genEditToken();
    localStorage.setItem(LS_CARD+shortId, JSON.stringify({editToken,data,updatedAt:Date.now()}));
    localStorage.setItem(LS_EDIT+editToken, shortId);
    return {shortId,editToken};
  },
  async update(editToken,data){
    const shortId=localStorage.getItem(LS_EDIT+editToken);
    if(!shortId) return null;
    const raw=localStorage.getItem(LS_CARD+shortId);
    if(!raw) return null;
    const rec=JSON.parse(raw);
    rec.data=data; rec.updatedAt=Date.now();
    localStorage.setItem(LS_CARD+shortId, JSON.stringify(rec));
    return {shortId};
  },
  async load(shortId){
    const raw=localStorage.getItem(LS_CARD+shortId);
    if(!raw) return null;
    try{return JSON.parse(raw).data}catch(e){return null}
  },
  async loadByEditToken(editToken){
    const shortId=localStorage.getItem(LS_EDIT+editToken);
    if(!shortId) return null;
    const data=await Backend.load(shortId);
    if(!data) return null;
    return {shortId,data};
  }
};

/* ============================================================
   Photo upload — reads from the gallery, resizes/compresses
   client-side, stores as a base64 data URI (no external link)
   ============================================================ */
function handlePhotoFile(file,onDone,onErr){
  if(!file) return;
  if(!/^image\//.test(file.type)){ onErr && onErr(); return }
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const MAX=360;
      let w=img.width, h=img.height;
      if(w>h){ if(w>MAX){h=Math.round(h*MAX/w); w=MAX;} } else { if(h>MAX){w=Math.round(w*MAX/h); h=MAX;} }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      try{ onDone(canvas.toDataURL('image/jpeg',0.82)) }catch(err){ onErr && onErr() }
    };
    img.onerror=function(){ onErr && onErr() };
    img.src=e.target.result;
  };
  reader.onerror=function(){ onErr && onErr() };
  reader.readAsDataURL(file);
}

/* ============================================================
   QR code rendering (uses the inlined qrcode-generator library)
   ============================================================ */
function qrSvg(text,opts){
  opts=opts||{};
  const cell=opts.cell||8, margin=opts.margin!=null?opts.margin:cell*2;
  const dark=opts.dark||'#0d1220', light=opts.light||'#ffffff';
  const qr=qrcode(0,'M');
  qr.addData(text);
  qr.make();
  const n=qr.getModuleCount();
  const size=n*cell+margin*2;
  let path='';
  for(let r=0;r<n;r++){
    for(let c=0;c<n;c++){
      if(qr.isDark(r,c)){
        const x=margin+c*cell, y=margin+r*cell;
        path+=`M${x},${y}h${cell}v${cell}h-${cell}z `;
      }
    }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="QR">`+
    `<rect width="${size}" height="${size}" fill="${light}"/><path d="${path}" fill="${dark}"/></svg>`;
}
function downloadQrPng(svgString,filename){
  const img=new Image();
  const svgBlob=new Blob([svgString],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(svgBlob);
  img.onload=function(){
    const canvas=document.createElement('canvas');
    canvas.width=img.naturalWidth||512; canvas.height=img.naturalHeight||512;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);
    URL.revokeObjectURL(url);
    canvas.toBlob(function(blob){
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download=filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    },'image/png');
  };
  img.onerror=function(){toast('QR')};
  img.src=url;
}

  if(hash.startsWith('#c=')){
    const shortId=hash.slice(3);
    applyTheme('b');
    const data=await Backend.load(shortId);
    if(data) return renderView(data);
    return renderNotFoundLocal(shortId);
  }
  if(hash.startsWith('#edit=')){
    const editToken=hash.slice(6);
    const res=await Backend.loadByEditToken(editToken);
    if(!res){applyTheme('b');return renderEditNotFound()}
    editState={shortId:res.shortId,editToken};
    loadStateFromData(res.data);
    state._step='form';
    return renderFill();
  }
  renderFill();
}
window.addEventListener('hashchange',boot);

function renderNotFoundLocal(shortId){
  document.getElementById('app').innerHTML=`
  <div class="not-found-box">
    <div class="ei">${svgIcon('warn',{size:52,sw:1.4})}</div>
    <h1>${t('notFoundTitle')}</h1>
    <p>${t('notFoundBody')}<br><br>${t('idLabel')} <b>${esc(shortId)}</b></p>
    <a class="btn btn-main" href="${location.origin+location.pathname}">${t('newCardBtn')}</a>
  </div>`;
}
function renderEditNotFound(){
  document.getElementById('app').innerHTML=`
  <div class="not-found-box">
    <div class="ei">${svgIcon('warn',{size:52,sw:1.4})}</div>
    <h1>${t('editNotFoundTitle')}</h1>
    <p>${t('editNotFoundBody')}</p>
    <a class="btn btn-main" href="${location.origin+location.pathname}">${t('newCardBtn')}</a>
  </div>`;
}

/* ============================================================
   FILL MODE
   ============================================================ */
let state={m:null,_step:'pick',n:'',t:'',c:'',bio:'',p:'',w:'',e:'',web:'',
  ig:'',li:'',tw:'',tt:'',sc:'',yt:'',tg:'',img:'',med:'',bg:'',gp:'',cond:'',all:'',meds:'',ep:''};

function renderFill(){
  if(!state.m || state._step==='pick') renderModePick();
  else renderModeForm();
}

function renderModePick(){
  applyTheme('b');
  const app=document.getElementById('app');
  app.innerHTML=`
  ${heroHTML()}
  <div class="wrap">
    <div class="fhead" style="padding-top:8px">
      <div class="fhead-eyebrow">${t('stepLabel')}</div>
      <h1>${t('pickTitle')}</h1>
      <p>${t('pickSub')}</p>
    </div>
    <div class="mode-grid">
      ${MODE_ORDER.map(k=>{const mo=MODES[k];return `
      <div class="mode-card" onclick="pickMode('${k}')">
        <div class="mc-ic">${svgIcon(mo.icon,{size:21})}</div>
        <div style="flex:1;min-width:0">
          <div class="mc-t">${bi(mo.title)}</div>
          <div class="mc-d">${bi(mo.desc)}</div>
        </div>
        <div class="mc-chev">${iconForward({size:16,sw:2})}</div>
      </div>`;}).join('')}
    </div>
    <div class="existing-row" onclick="document.getElementById('editEntry').focus()">
      <span>${t('existingCard')}</span>
      <div style="display:flex;align-items:center;gap:8px;flex:1;max-width:150px;margin-inline-start:10px">
        <input id="editEntry" placeholder="${t('manualEditPh')}" style="width:100%;background:var(--panel);border:1px solid var(--line);
          border-radius:8px;color:var(--txt);font-family:inherit;font-size:11px;padding:7px 9px" onclick="event.stopPropagation()">
      </div>
    </div>
    <div style="margin:-8px 0 16px;display:flex;justify-content:flex-end">
      <button class="btn btn-ghost" style="width:auto;padding:8px 16px;margin-top:0;font-size:11.5px" onclick="openManualEdit()">${t('manualEditBtn')}</button>
    </div>
    <a class="existing-row" style="justify-content:center;gap:8px" onclick="renderGuideStandalone();return false;" href="#">
      ${svgIcon('qr',{size:14,sw:1.7})}<span>${t('helpLink')}</span>
    </a>
    <div class="footer-note">
      <div class="fmark en">Revo</div>
      <div class="fsub">${t('footerSub')}</div>
    </div>
  </div>`;
}
function openManualEdit(){
  const v=document.getElementById('editEntry').value.trim();
  if(!v){toast(t('manualEditEmpty'));return}
  const m=v.match(/#edit=([\w-]+)/);
  location.hash='#edit='+(m?m[1]:v);
}
function pickMode(k){
  state.m=k; state._step='form';
  renderFill();
}
function backToPick(){state._step='pick';renderFill();}
function cancelEdit(){
  editState=null;
  Object.keys(state).forEach(k=>{state[k]=(k==='m'?null:(k==='_step'?'pick':''))});
  location.hash='';
  renderFill();
}
function loadStateFromData(data){
  Object.keys(state).forEach(k=>{if(k!=='_step')state[k]=(k==='m'?null:'')});
  state.m=data.m||'b';
  Object.keys(data).forEach(k=>{if(k!=='m')state[k]=data[k]});
}

function fieldsOf(mo){return mo.sections.flatMap(s=>s.fields)}
function requiredKeys(mo){return fieldsOf(mo).filter(f=>f.req).map(f=>f.k)}

function renderField(f){
  if(f.type==='photo') return renderPhotoField(f);
  const id='f_'+f.k;
  const reqMark=f.req?`<span class="req">*${t('req')}</span>`:'';
  const ph=esc(bi(f.ph)||'');
  const label=esc(bi(f.label));
  let control;
  if(f.type==='textarea'){
    control=`<textarea id="${id}" placeholder="${ph}" oninput="upd('${f.k}',this.value)"></textarea>`;
  }else if(f.type==='select'){
    const opts=f.opts.map(o=>`<option value="${o}">${o}</option>`).join('');
    control=`<select id="${id}" onchange="upd('${f.k}',this.value)"><option value="">${t('pickOpt')}</option>${opts}</select>`;
  }else if(f.icon && SOCIAL_ICON[f.k]){
    control=`<div class="icon-field">
      <div class="icon-pre" style="color:var(--accent)">${SOCIAL_ICON[f.k]({size:17,sw:1.6})}</div>
      <input id="${id}" type="text" dir="ltr" class="en" placeholder="${ph}" oninput="upd('${f.k}',this.value)">
    </div>`;
  }else{
    const ltr=(f.type==='tel'||f.k==='e'||f.k==='web');
    control=`<input id="${id}" type="${f.type||'text'}" ${ltr?'dir="ltr" class="en"':''} placeholder="${ph}" oninput="upd('${f.k}',this.value)">`;
  }
  const hint=f.hint?`<div class="hint">${esc(bi(f.hint))}</div>`:'';
  return `<div class="field"><label>${label} ${reqMark}</label>${control}${hint}</div>`;
}
function renderPhotoField(f){
  return `<div class="photo-row" onclick="document.getElementById('f_img_file').click()">
    <div class="photo-av-wrap">
      <div class="photo-av" id="photoAvPreview">${svgIcon('person',{size:24,sw:1.4})}</div>
      <div class="photo-badge">${svgIcon('cameraPlus',{size:12,sw:2})}</div>
    </div>
    <div style="flex:1">
      <div class="photo-title">${esc(bi(f.label))}</div>
      <div class="photo-desc">${esc(bi(f.hint))}</div>
    </div>
    <input type="file" id="f_img_file" accept="image/*" style="display:none" onchange="onPhotoPicked(this.files[0])">
  </div>`;
}
function onPhotoPicked(file){
  if(!file) return;
  handlePhotoFile(file, dataUrl=>{
    state.img=dataUrl;
    const prev=document.getElementById('photoAvPreview');
    if(prev) prev.innerHTML=`<img src="${dataUrl}" alt="">`;
    updateValidation();
  }, ()=>toast(t('photoErr')));
}
function renderSection(sec){
  return `<div class="card-box"><h3>${esc(bi(sec.title))}</h3>${sec.fields.map(renderField).join('')}</div>`;
}

function renderModeForm(){
  const mo=MODES[state.m];
  applyTheme('b'); // fill-mode chrome always uses the one Revo brand; only the final card carries a mode accent
  const app=document.getElementById('app');
  const isEditing=!!editState;
  app.innerHTML=`
  <div class="wrap">
    <div class="fhead">
      <div class="fhead-row">
        <div class="back-btn" onclick="${isEditing?'cancelEdit()':'backToPick()'}">${iconBack({size:15,sw:2})}</div>
        ${langToggleStaticHTML()}
      </div>
      <div class="fhead-icon-row">
        <div class="ic-tile">${svgIcon(mo.icon,{size:19})}</div>
        <div>
          <h1 style="font-size:17px">${bi(mo.title)}</h1>
        </div>
      </div>
      <p>${bi(mo.desc)}</p>
    </div>
    ${isEditing?`<div class="edit-banner">${svgIcon('pencil',{size:14,sw:2.2})} ${t('editBanner')}</div>`:''}
    ${mo.notice?`<div class="notice-box">${svgIcon('warn',{size:16,sw:1.9})}<span>${bi(mo.notice)}</span></div>`:''}
    ${mo.sections.map(renderSection).join('')}
    <div class="confirm-line">${svgIcon('check',{size:15,sw:2.2})}<span>${t('confirmLine')}</span></div>
    <button class="btn btn-main" id="genBtn" onclick="generateLink()" disabled>${isEditing?t('saveBtn'):t('createBtn')}</button>
    <div class="result-box" id="resultBox"></div>
    <div class="footer-note">
      <div class="fmark en">Revo</div>
      <div class="fsub">${t('footerSub')}</div>
    </div>
  </div>`;
  fillInputs(mo);
  updateValidation();
}
function langToggleStaticHTML(){
  return `<div class="lang-toggle" style="position:static" onclick="toggleLang()">
    <div class="seg ${LANG==='en'?'on':''} en">EN</div>
    <div class="seg ${LANG==='ar'?'on':''}">عربي</div>
  </div>`;
}
function fillInputs(mo){
  fieldsOf(mo).forEach(f=>{
    if(f.type==='photo'){
      if(state.img){
        const prev=document.getElementById('photoAvPreview');
        if(prev) prev.innerHTML=`<img src="${state.img}" alt="">`;
      }
      return;
    }
    const el=document.getElementById('f_'+f.k);
    if(el) el.value=state[f.k]||'';
  });
}
function upd(k,v){state[k]=v;updateValidation()}

function packState(){
  if(!state.m) return {};
  const mo=MODES[state.m];
  const d={};
  if(state.m!=='b') d.m=state.m;
  fieldsOf(mo).forEach(f=>{
    let v=state[f.k];
    if(!v) return;
    if(f.type==='photo'){ d[f.k]=v; return }
    if(HANDLE_FIELDS.includes(f.k)) v=cleanHandle(v);
    v=String(v).trim();
    if(v) d[f.k]=v;
  });
  return d;
}
function updateValidation(){
  const mo=MODES[state.m];
  if(!mo) return;
  const missing=requiredKeys(mo).some(k=>!String(state[k]||'').trim());
  const btn=document.getElementById('genBtn');
  if(btn) btn.disabled=missing;
}

async function generateLink(){
  const mo=MODES[state.m];
  const missing=requiredKeys(mo).find(k=>!String(state[k]||'').trim());
  if(missing){toast(t('reqMissing'));return}
  const d=packState();
  const wasEditing=!!editState;
  const btn=document.getElementById('genBtn');
  const origText=btn.textContent;
  btn.disabled=true; btn.textContent=t('saving');
  try{
    let shortId,editToken;
    if(wasEditing){
      const res=await Backend.update(editState.editToken,d);
      if(!res){toast(t('editNotFoundTitle'));return}
      shortId=res.shortId; editToken=editState.editToken;
    }else{
      const res=await Backend.create(d);
      shortId=res.shortId; editToken=res.editToken;
      editState={shortId,editToken};
      btn.textContent=t('saveBtn');
      const fhead=document.querySelector('.fhead');
      if(fhead && !document.querySelector('.edit-banner')){
        const banner=document.createElement('div');
        banner.className='edit-banner';
        banner.innerHTML=`${svgIcon('pencil',{size:14,sw:2.2})} ${t('editBanner')}`;
        fhead.insertAdjacentElement('afterend',banner);
      }
    }
    const base=location.origin+location.pathname;
    showResult(base+'#c='+shortId, base+'#edit='+editToken);
    toast(wasEditing?t('savedToast'):t('createdToast'));
    return;
  } finally {
    btn.disabled=false;
    if(btn.textContent===t('saving')) btn.textContent=wasEditing?origText:t('saveBtn');
  }
}
function showResult(viewUrl,editUrl){

  box.innerHTML=`

      <div class="success-ic">${svgIcon('check',{size:22,sw:2.3})}</div>
      <h3>${t('resultTitle')}</h3>
      <p>${t('resultSub')}</p>
    </div>
    <div class="result-section">
      <h4>${svgIcon('warn',{size:14,sw:2})}${t('editLinkTitle')}</h4>
      <div class="warn-box">${svgIcon('warn',{size:14,sw:2})}<span>${t('editWarn')}</span></div>
      <div class="qr-wrap">${svg}</div>
      <div class="link-row en">${esc(editUrl)}</div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="copyText(window._lastEditUrl,'${t('copyEditToast')}')">${svgIcon('copy',{size:15,sw:1.8})}${t('copy')}</button>
        <button class="btn btn-ghost" onclick="downloadQrPng(qrSvg(window._lastEditUrl,{cell:8,margin:16}),'revo-edit-qr.png')">${svgIcon('download',{size:15,sw:1.8})}${t('download')}</button>
      </div>
    </div>
    <div class="result-section">
      <h4>${svgIcon('qr',{size:14,sw:1.8})}${t('viewLinkTitle')}</h4>
      <div class="link-row en" style="color:var(--accent)">${esc(viewUrl)}</div>
      <div class="btn-row">
        <button class="btn btn-main" onclick="copyText(window._lastViewUrl,'${t('copyViewToast')}')">${svgIcon('copy',{size:15,sw:1.8})}${t('copyViewLink')}</button>
        <a class="btn btn-ghost" href="${viewUrl}" target="_blank" rel="noopener">${iconForward({size:14,sw:2})}${t('preview')}</a>
      </div>
    </div>
    <div class="result-section">
      <h4>${svgIcon('nfc',{size:14,sw:1.9})}${t('nextStepsTitle')}</h4>
      ${guideHTML(viewUrl)}
    </div>`;
  box.classList.add('show');
  box.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ============================================================
   VIEW MODE — the actual public digital card
   ============================================================ */
function buildAvatar(d,cls){
  const initial=esc((d.n||'?').trim().charAt(0)||'?');
  if(d.img){
    return `<img src="${esc(d.img)}" class="${cls} v-img" alt=""
      onerror="this.outerHTML='&lt;div class=&quot;${cls}&quot;&gt;${initial}&lt;/div&gt;'">`;
  }
  return `<div class="${cls}">${initial}</div>`;
}
function renderView(d){
  const m=d.m||'b';
  applyTheme(m);
  if(m==='s')return renderSocialView(d);
  if(m==='k')return renderKidsView(d);
  if(m==='h')return renderMedicalView(d);
  return renderBusinessView(d);
}
function renderBusinessView(d){
  const app=document.getElementById('app');
  let contacts=[];
  if(d.p)contacts.push(['phone',t('contactCall'),d.p,'tel:'+d.p.replace(/\s/g,'')]);
  if(d.w)contacts.push(['phone',t('contactWhatsapp'),d.w,'https://wa.me/'+d.w.replace(/[^0-9]/g,'')]);
  if(d.e)contacts.push(['mail',t('contactEmail'),d.e,'mailto:'+d.e]);
  if(d.web)contacts.push(['globe',t('contactWeb'),d.web,normalizeUrl(d.web)]);
  const socials=['ig','li','tw','tt'].filter(k=>d[k]).map(k=>[k,SOCIAL_LABELS[k],SOCIAL_LINKS[k](d[k])]);

  app.innerHTML=`
  <div class="vcard">
    <div class="vhero">
      ${buildAvatar(d,'v-av')}
      <h1>${esc(d.n||'')}</h1>
      ${(d.t||d.c)?`<div class="vsub">${esc(d.t||'')}${d.t&&d.c?' · ':''}${esc(d.c||'')}</div>`:''}
      ${d.bio?`<div class="vbio">${esc(d.bio)}</div>`:''}
      <button class="save-btn" onclick="saveContact(${JSON.stringify(d).replace(/"/g,'&quot;')})">${svgIcon('download',{size:17,sw:2})}${t('saveContact')}</button>
    </div>
    ${contacts.length?`<div class="contact-list">${contacts.map(([icn,label,val,href])=>`
      <a class="c-row" href="${href}">
        <div class="ci">${svgIcon(icn,{size:17,sw:1.6})}</div>
        <div class="ct"><b>${label}</b><span class="en">${esc(val)}</span></div>
      </a>`).join('')}</div>`:''}
    ${socials.length?`<div class="social-grid">${socials.map(([icn,label,href])=>`
      <a class="s-tile" href="${href}" target="_blank" rel="noopener">${SOCIAL_ICON[icn]?SOCIAL_ICON[icn]({size:17,sw:1.6}):''}<span class="en">${label}</span></a>`).join('')}</div>`:''}
    <div class="footer-note"><div class="fmark en">Revo</div><div class="fsub">${t('digitalCard')}</div></div>
  </div>`;
}
function renderSocialView(d){
  const app=document.getElementById('app');
  const socials=['ig','tt','sc','yt','tw','tg'].filter(k=>d[k]).map(k=>[k,SOCIAL_LABELS[k],SOCIAL_LINKS[k](d[k])]);
  app.innerHTML=`
  <div class="vcard">
    <div class="vhero">
      ${buildAvatar(d,'v-av')}
      <h1>${esc(d.n||'')}</h1>
      ${d.bio?`<div class="vbio">${esc(d.bio)}</div>`:''}
    </div>

      <a class="s-tile s-tile-lg" href="${href}" target="_blank" rel="noopener">${SOCIAL_ICON[icn]?SOCIAL_ICON[icn]({size:22,sw:1.6}):''}<span class="en">${label}</span></a>`).join('')}</div>`:''}

  </div>`;
}
function renderKidsView(d){
  const app=document.getElementById('app');
  const guardianTel=d.gp?esc(d.gp.replace(/\s/g,'')):'';
  app.innerHTML=`
  <div class="vcard">
    <div class="vhero">
      ${buildAvatar(d,'v-av')}
      <div class="kid-tag">${t('kidsSafetyTag')}</div>
      <h1>${esc(d.n||'')}</h1>
      ${d.bg?`<div class="badge-row"><span class="badge en">${esc(d.bg)}</span></div>`:''}
      ${guardianTel?`<a class="cta-btn" href="tel:${guardianTel}">${svgIcon('phone',{size:18,sw:2})}<span>${t('callGuardian')}</span></a>`:''}
      ${d.med?`<div class="vbio med-note"><b>${t('medInfo')}</b>${esc(d.med)}</div>`:''}

    <div class="safety-note">${svgIcon('shield',{size:16,sw:1.7})}<span>${t('kidsSafety')}</span></div>
    <div class="footer-note"><div class="fmark en">Revo</div><div class="fsub">${t('digitalCard')}</div></div>

function renderMedicalView(d){
  const app=document.getElementById('app');
  const epTel=d.ep?esc(d.ep.replace(/\s/g,'')):'';
  app.innerHTML=`
  <div class="vcard">
    <div class="vhero">
      ${d.img?buildAvatar(d,'v-av'):`<div class="med-cross">${svgIcon('health',{size:28,sw:2})}</div>`}

    </div>
    ${(d.all||d.cond||d.meds)?`<div class="med-info">
      ${d.all?`<div class="med-block med-alert"><b>${t('medAllergy')}</b><p>${esc(d.all)}</p></div>`:''}
      ${d.cond?`<div class="med-block"><b>${t('medCond')}</b><p>${esc(d.cond)}</p></div>`:''}
      ${d.meds?`<div class="med-block"><b>${t('medMeds')}</b><p>${esc(d.meds)}</p></div>`:''}
    </div>`:''}
    <button class="save-btn" onclick="saveContact(${JSON.stringify(d).replace(/"/g,'&quot;')})">${svgIcon('download',{size:17,sw:2})}${t('saveEmergency')}</button>
    <div class="footer-note"><div class="fmark en">Revo</div><div class="fsub">${t('digitalCard')}</div></div>

function renderEmpty(){
  document.getElementById('app').innerHTML=`
  <div class="empty-view">
    <div class="ei">${svgIcon('link',{size:52,sw:1.4})}</div>
    <h1 style="font-size:18px;margin-bottom:10px;font-weight:800">${t('invalidLinkTitle')}</h1>
    <p style="color:var(--mut);font-size:13px;line-height:1.8">${t('invalidLinkBody')}</p>
  </div>`;
}

/* vCard generation + download */
function buildVCard(d){
  const m=d.m||'b';
  const lines=['BEGIN:VCARD','VERSION:3.0','FN:'+(d.n||'')];
  if(m==='h'){
    if(d.ep)lines.push('TEL;TYPE=CELL:'+d.ep);
    const note=[];
    if(d.bg)note.push('Blood type: '+d.bg);
    if(d.all)note.push('Allergies: '+d.all);
    if(d.cond)note.push('Chronic: '+d.cond);
    if(d.meds)note.push('Meds: '+d.meds);
    if(note.length)lines.push('NOTE:'+note.join(' | '));
  }else{
    if(d.c)lines.push('ORG:'+d.c);
    if(d.t)lines.push('TITLE:'+d.t);
    if(d.p)lines.push('TEL;TYPE=CELL:'+d.p);
    if(d.e)lines.push('EMAIL:'+d.e);
    if(d.web)lines.push('URL:'+normalizeUrl(d.web));
  }
  lines.push('END:VCARD');
  return lines.join('\n');
}
function saveContact(d){
  const blob=new Blob([buildVCard(d)],{type:'text/vcard'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=(d.n||'contact').replace(/\s/g,'_')+'.vcf';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast(t('savingContact'));
}

boot();
